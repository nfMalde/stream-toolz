name: Idea or wish
description: Something Stream Toolz could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help you?
      description: What do you want to do in your stream, and what is in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? What would you or your viewers see or hear?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - ReadMyChat
        - Countdown
        - Chat Overlay
        - Alerts
        - Channel Points
        - Chat Bot
        - Voices or languages
        - Something new (a module of its own)
        - The app in general
    validations:
      required: true
