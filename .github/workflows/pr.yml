# Every pull request to main: type check, tests and the app build on Windows and Linux (macOS comes with its installer,
# docs/06-release.md "Later"). Actions are pinned to exact versions, each at least 14 days old when pinned
# (docs/03-security.md "Dependencies"); Dependabot proposes newer ones after the same wait (.github/dependabot.yml).
# From GT Toolz, without the Discord announcement (the user, 2026-11-22).
name: PR build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      # The runner's npm 10.9.8 fails the signature check now and then ("pkijs@3.4.3 has attestations but no
      # corresponding public key(s)", four Windows builds on 2026-11-22, also after three tries), npm 11 does not:
      # an exact npm 11, at least 14 days old when pinned, for the whole job (also inside scripts/release).
      - run: npm install -g npm@11.21.2
      # .npmrc: no install scripts, exact versions from the lockfile.
      - run: npm ci
      # The registry's signing keys are fetched for this check; now and then they are missing for a moment
      # ("pkijs@3.4.3 has attestations but no corresponding public key(s)", 2026-11-22, two main builds in a row,
      # green on a re-run): three tries, 30 s apart, before the build counts as failed.
      - name: npm audit signatures
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm audit signatures && exit 0
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
