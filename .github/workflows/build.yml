# Every push to main: the type check, the tests and the app build on Windows and Linux. No installers and no uploads:
# installers are made only by the release workflow, after the approval (release.yml).
# Actions are pinned to exact versions, each at least 14 days old when pinned (docs/03-security.md "Dependencies").
name: Build (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      # .npmrc: no install scripts, exact versions from the lockfile.
      - run: npm ci
      # The registry's signing keys are fetched for this check; now and then they are missing for a moment
      # ("pkijs@3.4.3 has attestations but no corresponding public key(s)", 2026-11-22, two main builds in a row,
      # green on a re-run): three tries, 30 s apart, before the build counts as failed.
      - name: npm audit signatures
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm audit signatures && exit 0
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:app
